[project]
name = "daltix-case"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "diogovasconcelosmerca", email = "diogovasconcelosmerca@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "altair>=6.3.0",
    "catboost>=1.2.10",
    "duckdb>=1.5.5",
    "feature-engine>=1.9.4",
    "hdbscan>=0.8.44",
    "imbalanced-learn>=0.14.2",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "pandera>=0.33.1",
    "plotly>=7.1.0",
    "polars>=1.44.2",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pyod>=3.6.6",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "shap>=0.49.1",
    "skore>=0.26.0",
    "skrub>=0.10.1",
    "statsmodels>=0.15.0",
    "xgboost>=3.4.1",
    "xlsxwriter>=3.2.9",
]

[project.scripts]
daltix-case = "daltix_case:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "sqlfluff>=4.3.0",
]
